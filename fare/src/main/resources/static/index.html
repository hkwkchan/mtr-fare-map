<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fare Finder 票價查詢</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23d71920'/%3E%3Ctext x='32' y='41' fill='white' font-family='Arial,sans-serif' font-size='21' font-weight='700' text-anchor='middle'%3EMTR%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>
            <h1>MTR Fare Finder 港鐵票價查詢</h1>
            <p>Choose your start and destination stations to see a suggested route and adult Octopus fare.
                <br/>選擇起點及目的地車站以查看建議路線及成人八達通車費。</p>
        </header>

        <section class="card" aria-label="Find a route">
            <div id="station-loading" class="loading" role="status">
                <span class="spinner" aria-hidden="true"></span>
            </div>
            <form id="route-form" hidden>
                <div class="fields">
                    <div>
                        <label for="start">Start station / 起點車站</label>
                        <div class="station-picker">
                            <input id="start" name="start" type="text" autocomplete="off" required
                                placeholder="Type a station name / 輸入車站名稱" aria-autocomplete="list"
                                aria-controls="start-suggestions" aria-expanded="false">
                            <div class="suggestions" id="start-suggestions" role="listbox" hidden></div>
                        </div>
                    </div>
                    <div>
                        <label for="destination">Destination station / 目的地車站</label>
                        <div class="station-picker">
                            <input id="destination" name="destination" type="text" autocomplete="off" required
                                placeholder="Type a station name / 輸入車站名稱" aria-autocomplete="list"
                                aria-controls="destination-suggestions" aria-expanded="false">
                            <div class="suggestions" id="destination-suggestions" role="listbox" hidden></div>
                        </div>
                    </div>
                </div>
                <button id="submit" type="submit">Find route and fare 查詢路線及車費</button>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section id="results" class="card results" aria-labelledby="results-heading" hidden>
            <h2 id="results-heading">Route and fare 路線及車費</h2>
            <div class="fare">
                <span class="fare-label">Adult Octopus fare 成人八達通車費</span>
                <span id="fare-price">—</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Leg / 路段</th>
                        <th scope="col">Stations / 車站</th>
                    </tr>
                </thead>
                <tbody id="legs"></tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>Data source: MTR open data on <a href="https://data.gov.hk/">data.gov.hk</a>.
            <br>資料來源：data.gov.hk 的港鐵開放數據。</p>
    </footer>
    <script>
        const form = document.querySelector("#route-form");
        const stationLoading = document.querySelector("#station-loading");
        const submitButton = document.querySelector("#submit");
        const message = document.querySelector("#message");
        const results = document.querySelector("#results");
        const farePrice = document.querySelector("#fare-price");
        const legsBody = document.querySelector("#legs");
        const stationInputs = [
            document.getElementById("start"),
            document.getElementById("destination")
        ];
        let stations;

        const loadStations = async () => {
            let lastError;
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch("/api/stations/all");
                    if (!response.ok) {
                        throw new Error("Station search is unavailable. Please try again.");
                    }
                    stations = await response.json();
                    return;
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError instanceof Error
                ? lastError
                : new Error("Station search is unavailable. Please try again.");
        };

        stationInputs.forEach((input) => {
            input.disabled = true;
        });
        submitButton.disabled = true;
        loadStations()
            .then(() => {
                stationInputs.forEach((input) => {
                    input.disabled = false;
                });
                submitButton.disabled = false;
                form.hidden = false;
                message.textContent = "";
                message.dataset.error = "false";
            })
            .catch((error) => {
                message.textContent = `${error.message || "Station search is unavailable."} Please reload the page.`;
                message.dataset.error = "true";
            })
            .finally(() => {
                stationLoading.hidden = true;
            });

        let scheduleRequest = 0;
        const clearStartSchedule = () => {
            scheduleRequest++;
        };

        const updateStartSchedule = async (start, firstLeg) => {
            const currentRequest = ++scheduleRequest;
            const scheduleStatus = legsBody.querySelector(".next-train");
            if (!start || !firstLeg || firstLeg.stations.length < 2 || !scheduleStatus) {
                return;
            }
            scheduleStatus.textContent = "[Loading…]";
            scheduleStatus.setAttribute("aria-label", "Loading next train arrival");
            scheduleStatus.dataset.error = "false";

            try {
                const direction = firstLeg.direction === "UT" ? "UP"
                    : firstLeg.direction === "DT" ? "DOWN" : null;
                if (!direction) {
                    throw new Error(`Could not determine the ${firstLeg.line} direction for this route.`);
                }

                const url = new URL("https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php");
                url.searchParams.set("line", firstLeg.line);
                url.searchParams.set("sta", start.stationCode);
                url.searchParams.set("lang", "en");
                const response = await fetch(url, {signal: AbortSignal.timeout(8000)});
                if (!response.ok) {
                    throw new Error("The train schedule service returned an error.");
                }
                const data = await response.json();
                const schedule = data.data?.[`${firstLeg.line}-${start.stationCode}`];
                if (data.status !== 1 || !schedule) {
                    throw new Error(data.message || "The train schedule is unavailable.");
                }

                if (currentRequest !== scheduleRequest) {
                    return;
                }

                const train = (schedule[direction] || []).find((arrival) => arrival.valid === "Y");
                const disruption = data.isdelay === "Y" ? " · Service disruption reported" : "";
                const updated = `Updated ${schedule.curr_time || data.curr_time || "just now"}`;
                if (train) {
                    const destination = stations.find((station) => station.stationCode === train.dest);
                    const destinationName = destination ? stationLabel(destination) : train.dest;
                    const minutes = Number(train.ttnt);
                    const arrivalTime = train.ttnt != null && String(train.ttnt).trim() !== "" && Number.isFinite(minutes)
                        ? `${minutes} min`
                        : (train.time || "").split(" ")[1]?.slice(0, 5) || "Time unavailable";
                    scheduleStatus.textContent = `[${arrivalTime}${disruption}]`;
                    scheduleStatus.title = `Next train: ${arrivalTime} · Platform ${train.plat} · To ${destinationName}`
                        + ` · ${updated}${disruption}`;
                } else {
                    scheduleStatus.textContent = `[No arrivals${disruption}]`;
                    scheduleStatus.title = `No train arrivals currently available · ${updated}${disruption}`;
                }
                scheduleStatus.setAttribute("aria-label", scheduleStatus.title);
            } catch (error) {
                if (currentRequest !== scheduleRequest) {
                    return;
                }
                scheduleStatus.textContent = "[Arrivals unavailable]";
                scheduleStatus.title = error.message || "Train schedules are temporarily unavailable.";
                scheduleStatus.setAttribute("aria-label", scheduleStatus.title);
                scheduleStatus.dataset.error = "true";
            }
        };

        const createStationPicker = (inputId, suggestionsId, getExcludedStation = () => null, onUpdate = () => {}) => {
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);
            let selectedStation = null;
            let activeIndex = -1;

            const closeSuggestions = () => {
                suggestions.hidden = true;
                input.setAttribute("aria-expanded", "false");
                input.removeAttribute("aria-activedescendant");
                activeIndex = -1;
            };

            const showMessage = (text, isError = false) => {
                message.textContent = text;
                message.dataset.error = String(isError);
            };

            const setActiveOption = (index) => {
                const options = [...suggestions.querySelectorAll('[role="option"]')];
                if (options.length === 0) {
                    activeIndex = -1;
                    input.removeAttribute("aria-activedescendant");
                    return;
                }

                activeIndex = (index + options.length) % options.length;
                options.forEach((option, optionIndex) => {
                    const isActive = optionIndex === activeIndex;
                    option.classList.toggle("active", isActive);
                    option.setAttribute("aria-selected", String(isActive));
                });

                const activeOption = options[activeIndex];
                input.setAttribute("aria-activedescendant", activeOption.id);
                activeOption.scrollIntoView({block: "nearest"});
            };

            const showSuggestions = () => {
                const excludedStation = getExcludedStation();
                if (selectedStation && selectedStation.stationId === excludedStation?.stationId) {
                    selectedStation = null;
                    input.value = "";
                }
                const query = input.value.trim();
                closeSuggestions();
                activeIndex = -1;

                if (query.length < 1) {
                    return;
                }

                const normalizedQuery = query.toLowerCase();
                const matches = stations.filter((station) =>
                    station.stationId !== excludedStation?.stationId
                    && [station.englishName, station.chineseName, station.stationCode]
                        .some((value) => value.toLowerCase().includes(normalizedQuery)));
                suggestions.replaceChildren();
                matches.forEach((station, index) => {
                    const option = document.createElement("button");
                    option.type = "button";
                    option.className = "suggestion";
                    option.setAttribute("role", "option");
                    option.id = `${suggestionsId}-option-${index}`;
                    option.setAttribute("aria-selected", "false");

                    const name = document.createElement("span");
                    name.textContent = station.englishName;
                    option.append(name);

                    if (station.chineseName) {
                        const chinese = document.createElement("span");
                        chinese.className = "chinese-name";
                        chinese.textContent = station.chineseName;
                        option.append(chinese);
                    }

                    const selectStation = () => {
                        selectedStation = station;
                        input.value = stationLabel(station);
                        closeSuggestions();
                        showMessage("");
                        onUpdate();
                    };

                    option.addEventListener("click", selectStation);
                    option.addEventListener("mouseenter", () => setActiveOption(index));
                    suggestions.append(option);
                });
                if (matches.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "suggestion";
                    empty.textContent = "No matching stations";
                    suggestions.append(empty);
                }
                suggestions.hidden = false;
                input.setAttribute("aria-expanded", "true");
            };

            input.addEventListener("input", () => {
                selectedStation = null;
                results.hidden = true;
                clearStartSchedule();
                showSuggestions();
                onUpdate();
            });

            input.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeSuggestions();
                    return;
                }

                if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                    const options = suggestions.querySelectorAll('[role="option"]');
                    if (options.length === 0) {
                        return;
                    }
                    event.preventDefault();
                    if (suggestions.hidden) {
                        showSuggestions();
                    }
                    const availableOptions = suggestions.querySelectorAll('[role="option"]');
                    if (availableOptions.length === 0) {
                        return;
                    }
                    if (event.key === "ArrowDown") {
                        setActiveOption(activeIndex + 1);
                    } else {
                        setActiveOption(activeIndex < 0 ? availableOptions.length - 1 : activeIndex - 1);
                    }
                    return;
                }

                if (event.key === "Enter" && activeIndex >= 0) {
                    const activeOption = suggestions.querySelectorAll('[role="option"]')[activeIndex];
                    if (activeOption) {
                        event.preventDefault();
                        activeOption.click();
                    }
                }
            });

            return {
                getSelectedStation: () => selectedStation,
                closeSuggestions,
                refreshSuggestions: showSuggestions
            };
        };

        let destinationPicker;
        const startPicker = createStationPicker(
            "start",
            "start-suggestions",
            () => null,
            () => destinationPicker.refreshSuggestions()
        );
        destinationPicker = createStationPicker(
            "destination",
            "destination-suggestions",
            () => startPicker.getSelectedStation()
        );

        const readError = async (response, fallback) => {
            try {
                const body = await response.json();
                return body.detail || body.message || fallback;
            } catch {
                return fallback;
            }
        };

        const stationLabel = (station) => {
            return station.chineseName
                ? `${station.englishName} (${station.chineseName})`
                : station.englishName;
        };

        const displayRoute = (route) => {
            legsBody.replaceChildren();
            if (route.legs.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 2;
                cell.textContent = "You are already at your destination.";
                row.append(cell);
                legsBody.append(row);
                return;
            }

            route.legs.forEach((leg, legIndex) => {
                const row = document.createElement("tr");
                const lineCell = document.createElement("th");
                lineCell.scope = "row";
                lineCell.textContent = leg.line === "WALK" ? "Walk" : leg.line;

                const stationsCell = document.createElement("td");
                const stationGrid = document.createElement("div");
                stationGrid.className = "station-grid";
                leg.stations.forEach((station, stationIndex) => {
                    const stationItem = document.createElement("span");
                    stationItem.className = "route-station";
                    const stationName = document.createElement("span");
                    stationName.textContent = stationLabel(station);
                    if (legIndex === 0 && stationIndex === 0 && leg.stations.length >= 2) {
                        const nextTrain = document.createElement("span");
                        nextTrain.className = "next-train";
                        nextTrain.setAttribute("role", "status");
                        nextTrain.setAttribute("aria-live", "polite");
                        stationName.append(nextTrain);
                    }
                    stationItem.append(stationName);
                    stationGrid.append(stationItem);
                });
                stationsCell.append(stationGrid);
                row.append(lineCell, stationsCell);
                legsBody.append(row);
            });
        };

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            startPicker.closeSuggestions();
            destinationPicker.closeSuggestions();
            const start = startPicker.getSelectedStation();
            const destination = destinationPicker.getSelectedStation();
            if (!start || !destination) {
                message.textContent = "Choose both stations from the search suggestions.";
                message.dataset.error = "true";
                return;
            }
            if (start.stationId === destination.stationId) {
                message.textContent = "Choose a destination different from the start station.";
                message.dataset.error = "true";
                return;
            }

            clearStartSchedule();
            submitButton.disabled = true;
            message.textContent = "Finding your route…";
            message.dataset.error = "false";
            results.hidden = true;

            try {
                const params = new URLSearchParams({start: start.stationId, dest: destination.stationId});
                const routeResponse = await fetch(`/api/route?${params}`);
                if (!routeResponse.ok) {
                    throw new Error(await readError(routeResponse, "Could not find a route."));
                }
                const route = await routeResponse.json();
                displayRoute(route);
                farePrice.textContent = route.fare
                    ? `HK$${(route.fare.octAdultCents / 100).toFixed(2)}`
                    : "Unavailable";
                results.hidden = false;
                message.textContent = "";
                updateStartSchedule(start, route.legs[0]);
            } catch (error) {
                message.textContent = error.message || "Could not find a route. Please try again.";
                message.dataset.error = "true";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
