AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 website, HTTP API, and MTR fare Lambda function.

Parameters:
  DeploymentBucket:
    Type: String
    Description: Existing S3 bucket used to stage the Lambda ZIP and website files.
  LambdaCodeKey:
    Type: String
    Description: S3 key of the Lambda ZIP in the deployment bucket.
  IndexHtmlKey:
    Type: String
    Description: S3 key of index.html in the deployment bucket.
  StylesCssKey:
    Type: String
    Description: S3 key of styles.css in the deployment bucket.
  AssetsVersion:
    Type: String
    Description: Change this value whenever the staged website files change.

Resources:
  FareLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  FareLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: java21
      Handler: com.example.fare.StreamLambdaHandler
      Role: !GetAtt FareLambdaExecutionRole.Arn
      MemorySize: 1024
      Timeout: 30
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaCodeKey

  WebsiteAssetsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: CopyWebsiteAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${DeploymentBucket}/${IndexHtmlKey}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DeploymentBucket}/${StylesCssKey}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${WebsiteBucket}/index.html'
                  - !Sub 'arn:${AWS::Partition}:s3:::${WebsiteBucket}/styles.css'

  WebsiteAssetsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WebsiteAssetsExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          s3 = boto3.client("s3")

          def handler(event, context):
              properties = event["ResourceProperties"]
              website_bucket = properties["WebsiteBucket"]
              assets = [
                  (properties["IndexHtmlKey"], "index.html", "text/html; charset=utf-8"),
                  (properties["StylesCssKey"], "styles.css", "text/css; charset=utf-8"),
              ]
              physical_id = event.get("PhysicalResourceId", "website-assets")

              try:
                  if event["RequestType"] == "Delete":
                      for _, destination_key, _ in assets:
                          s3.delete_object(Bucket=website_bucket, Key=destination_key)
                  else:
                      source_bucket = properties["DeploymentBucket"]
                      for source_key, destination_key, content_type in assets:
                          response = s3.get_object(Bucket=source_bucket, Key=source_key)
                          s3.put_object(
                              Bucket=website_bucket,
                              Key=destination_key,
                              Body=response["Body"].read(),
                              ContentType=content_type,
                          )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
              except Exception:
                  logging.exception("Failed to deploy website assets")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, physical_id)

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-fare-api'
      ProtocolType: HTTP

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FareLambdaFunction.Arn
      PayloadFormatVersion: '1.0'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${LambdaIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 30

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt FareLambdaFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  WebsiteAssets:
    Type: Custom::WebsiteAssets
    DependsOn: WebsiteBucketPolicy
    Properties:
      ServiceToken: !GetAtt WebsiteAssetsFunction.Arn
      DeploymentBucket: !Ref DeploymentBucket
      WebsiteBucket: !Ref WebsiteBucket
      IndexHtmlKey: !Ref IndexHtmlKey
      StylesCssKey: !Ref StylesCssKey
      AssetsVersion: !Ref AssetsVersion

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

Outputs:
  LambdaFunctionArn:
    Description: ARN of the deployed fare Lambda function.
    Value: !GetAtt FareLambdaFunction.Arn
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint
  WebsiteBucketName:
    Description: Private bucket for the website files.
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Description: HTTPS website URL.
    Value: !Sub 'https://${WebsiteDistribution.DomainName}/'
